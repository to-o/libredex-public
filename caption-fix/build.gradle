plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.to_o.libredex.captionfix'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.to_o.libredex.captionfix'
        minSdk 27
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly project(':xposed-stubs')
    testImplementation 'junit:junit:4.13.2'
}
